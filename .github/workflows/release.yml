name: Build Windows x64 and preview release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build
        shell: cmd
        run: Build-Windows.cmd
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash OledBlackScreen.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OledBlackScreen.exe" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLED-Black-Screen-Windows-x64
          path: |
            OledBlackScreen.exe
            SHA256SUMS.txt
      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view v0.1.0-preview --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Preview release already exists."
          } else {
            gh release create v0.1.0-preview OledBlackScreen.exe SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "v0.1.0-preview" --notes "Unsigned preview build for Windows x64. Not yet validated in a live Windows session." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Release failed" }
          }
